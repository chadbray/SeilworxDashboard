name: Update and publish dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1-5"
      timezone: "Europe/Berlin"
    - cron: "0 15 * * 1-5"
      timezone: "Europe/Berlin"
    - cron: "0 17 * * 1-5"
      timezone: "Europe/Berlin"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seilworx-dashboard
  cancel-in-progress: false

jobs:
  update-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check source files
        run: npm run check

      - name: Read current PlanCraft planning
        run: npm run update
        env:
          PLANCRAFT_EMAIL: ${{ secrets.PLANCRAFT_EMAIL }}
          PLANCRAFT_PASSWORD: ${{ secrets.PLANCRAFT_PASSWORD }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
